version: '3'

silent: true

tasks:
  default:
    desc: Liste les commandes
    cmds:
      - task --list

  run:
    desc: Rapport web (collecte + ouverture du navigateur)
    cmds:
      - node bin/ai-agent-stats.js {{.CLI_ARGS}}

  term:
    desc: Rapport terminal
    cmds:
      - node bin/ai-agent-stats.js --terminal {{.CLI_ARGS}}

  json:
    desc: Rapport brut en JSON dans build/report.json
    cmds:
      - mkdir -p build
      - node bin/ai-agent-stats.js --json --quiet > build/report.json
      - 'echo "→ build/report.json ($(du -h build/report.json | cut -f1))"'

  html:
    desc: Rapport HTML dans build/report.html, sans ouvrir le navigateur
    cmds:
      - mkdir -p build
      - node bin/ai-agent-stats.js --out build/report.html --no-open

  test:
    desc: Tests unitaires
    cmds:
      - node --test test/unit.test.js

  check:
    desc: Tests + vérification que le CLI démarre et produit un rapport complet
    deps: [test]
    cmds:
      - node bin/ai-agent-stats.js --help > /dev/null
      - node bin/ai-agent-stats.js --json --quiet | node scripts/assert-report.js

  bench:
    desc: Chronomètre une collecte complète
    cmds:
      - 'time node bin/ai-agent-stats.js --json --quiet > /dev/null'

  pack:
    desc: Construit le tarball npm et liste son contenu
    cmds:
      - npm pack --dry-run

  ccusage-diff:
    desc: Compare les totaux de tokens avec ccusage (nécessite le réseau)
    cmds:
      - node scripts/compare-ccusage.js

  npm-status:
    desc: Qui suis-je sur npm, et le paquet existe-t-il ?
    cmds:
      - 'npm whoami || echo "→ non authentifié : lance npm login"'
      - 'npm view ai-agent-stats version 2>/dev/null || echo "→ paquet pas encore publié"'
      - 'npm trust list ai-agent-stats 2>/dev/null || true'

  bootstrap:
    desc: "Amorçage : publie la 1re version puis déclare GitHub Actions publieur de confiance"
    # Le registre refuse POST /-/package/<nom>/trust tant que le paquet n'existe pas
    # (404 « Package not found »), donc la toute première version part d'ici.
    interactive: true
    vars:
      NPM: npx --yes npm@11.17.0   # `npm trust` exige npm >= 11.10 ; devbox fournit 11.6
    cmds:
      - '{{.NPM}} whoami'
      - '{{.NPM}} publish --access public'
      - task: trust

  trust:
    desc: "Déclare GitHub Actions publieur de confiance (OIDC) — exige un paquet déjà publié"
    interactive: true
    vars:
      NPM: npx --yes npm@11.17.0
    cmds:
      - '{{.NPM}} trust github ai-agent-stats --file publish.yml --repo devthejo/ai-agent-stats --env npm --allow-publish'
      - '{{.NPM}} trust list ai-agent-stats'

  release:
    desc: 'Pose une version, taggue et pousse — la CI publie sur la Release GitHub. Ex: task release -- 0.2.0'
    cmds:
      - 'test -n "{{.CLI_ARGS}}" || (echo "usage - task release -- <version>" && exit 1)'
      - 'test -z "$(git status --porcelain)" || (echo "arbre de travail sale" && exit 1)'
      - task test
      - npm version {{.CLI_ARGS}} --no-git-tag-version
      - git add package.json
      - 'git commit -m "chore(release): v{{.CLI_ARGS}}"'
      - git tag -a "v{{.CLI_ARGS}}" -m "v{{.CLI_ARGS}}"
      - git push origin HEAD --tags
      - 'echo "→ crée la Release GitHub sur le tag v{{.CLI_ARGS}} pour déclencher la publication"'

  clean:
    desc: Supprime les artefacts locaux
    cmds:
      - rm -rf build *.tgz
