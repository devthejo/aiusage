version: '3'

silent: true

tasks:
  default:
    desc: Liste les commandes
    cmds:
      - task --list

  run:
    desc: Rapport web (collecte + ouverture du navigateur)
    cmds:
      - node bin/aiusage.js {{.CLI_ARGS}}

  term:
    desc: Rapport terminal
    cmds:
      - node bin/aiusage.js --terminal {{.CLI_ARGS}}

  json:
    desc: Rapport brut en JSON dans build/report.json
    cmds:
      - mkdir -p build
      - node bin/aiusage.js --json --quiet > build/report.json
      - 'echo "→ build/report.json ($(du -h build/report.json | cut -f1))"'

  html:
    desc: Rapport HTML dans build/report.html, sans ouvrir le navigateur
    cmds:
      - mkdir -p build
      - node bin/aiusage.js --out build/report.html --no-open

  test:
    desc: Tests unitaires
    cmds:
      - node --test test/unit.test.js

  check:
    desc: Tests + vérification que le CLI démarre et produit un rapport complet
    deps: [test]
    cmds:
      - node bin/aiusage.js --help > /dev/null
      - node bin/aiusage.js --json --quiet | node scripts/assert-report.js

  bench:
    desc: Chronomètre une collecte complète
    cmds:
      - 'time node bin/aiusage.js --json --quiet > /dev/null'

  pack:
    desc: Construit le tarball npm et liste son contenu
    cmds:
      - npm pack --dry-run

  ccusage-diff:
    desc: Compare les totaux de tokens avec ccusage (nécessite le réseau)
    cmds:
      - node scripts/compare-ccusage.js

  npm-status:
    desc: Qui suis-je sur npm, et le paquet existe-t-il ?
    cmds:
      - 'npm whoami || echo "→ non authentifié : lance npm login"'
      - 'npm view aiusage version 2>/dev/null || echo "→ paquet pas encore publié"'
      - 'npm trust list aiusage 2>/dev/null || true'

  trust:
    desc: "Déclare GitHub Actions publieur de confiance (OIDC) — npm demandera un code 2FA"
    # `npm trust` accepte un paquet qui n'existe pas encore, contrairement à
    # l'interface web (npm/cli#8544) : la CI peut donc publier la 1re version en OIDC.
    interactive: true
    vars:
      # `npm trust` n'existe qu'à partir de npm 11.10 ; celui que fournit devbox
      # est plus ancien, donc on épingle explicitement.
      NPM: npx --yes npm@latest
    cmds:
      - '{{.NPM}} whoami'
      - '{{.NPM}} trust github aiusage --file publish.yml --repo devthejo/aiusage --env npm --allow-publish'
      - '{{.NPM}} trust list aiusage'

  release:
    desc: 'Pose une version, taggue et pousse — la CI publie sur la Release GitHub. Ex: task release -- 0.2.0'
    cmds:
      - 'test -n "{{.CLI_ARGS}}" || (echo "usage - task release -- <version>" && exit 1)'
      - 'test -z "$(git status --porcelain)" || (echo "arbre de travail sale" && exit 1)'
      - task test
      - npm version {{.CLI_ARGS}} --no-git-tag-version
      - git add package.json
      - 'git commit -m "chore(release): v{{.CLI_ARGS}}"'
      - git tag -a "v{{.CLI_ARGS}}" -m "v{{.CLI_ARGS}}"
      - git push origin HEAD --tags
      - 'echo "→ crée la Release GitHub sur le tag v{{.CLI_ARGS}} pour déclencher la publication"'

  clean:
    desc: Supprime les artefacts locaux
    cmds:
      - rm -rf build *.tgz
